<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tahoma', Arial, sans-serif; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background: white;
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-box input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 16px;
            background: #f8f9fa;
        }
        .login-box input:focus {
            border-color: #764ba2;
            outline: none;
            background: white;
        }
        .login-box button {
            width: 100%;
            padding: 15px;
            margin: 15px 0 10px;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .login-box button:hover {
            transform: translateY(-2px);
        }
        .login-box .error {
            color: #f44336;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        .login-box .success {
            color: #4CAF50;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        .login-box .hint {
            color: #999;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔐</h2>
        <p>لطفاً اطلاعات خود را وارد کنید</p>
        
        <input type="text" id="username" placeholder="👤 نام خود را وارد کنید">
        <input type="password" id="password" placeholder="🔒 رمز عبور">
        
        <button onclick="checkLogin()">ورود</button>
        
        <div class="error" id="errorMsg">❌ اطلاعات وارد شده صحیح نیست!</div>
        <div class="success" id="successMsg">✅ در حال انتقال...</div>
        <div class="hint">فقط افراد مجاز دسترسی دارند</div>
    </div>

    <script>
        function checkLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');

            const correctPassword = 'Amir887777';
            const correctUsername = 'امیرحسین';

            if (username === correctUsername && password === correctPassword) {
                errorMsg.style.display = 'none';
                successMsg.style.display = 'block';
                setTimeout(() => {
                    window.location.href = 'main.html';
                }, 1000);
            } else {
                successMsg.style.display = 'none';
                errorMsg.style.display = 'block';
                setTimeout(() => {
                    errorMsg.style.display = 'none';
                }, 3000);
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                checkLogin();
            }
        });
    </script>
</body>
</html>
